name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    env:
      # The tests need neither the network nor an API key. Refusing Hugging Face access makes sure it stays that way.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (CPU-only PyTorch on Linux keeps this to a few hundred MB)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "Linux" ]; then
            pip install torch --index-url https://download.pytorch.org/whl/cpu
          fi
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests eval

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          pytest -q -rf --tb=short -p no:cacheprovider 2>&1 | tee pytest.log

      - name: Show failing tests as annotations (job logs need a login, annotations do not)
        if: failure()
        shell: bash
        run: |
          grep -E "^(FAILED|ERROR) " pytest.log | head -25 | while IFS= read -r line; do
            echo "::error title=failed test::${line:0:480}"
          done
          grep -E "^E  " pytest.log | head -25 | while IFS= read -r line; do
            echo "::warning title=assertion detail::${line:0:480}"
          done
